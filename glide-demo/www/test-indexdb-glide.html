<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glide IndexedDB Demo</title>
  <link rel="stylesheet" href="./test-indexdb-glide.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f9fc;
      --panel: #ffffff;
      --panel-2: #eef4fb;
      --line: #d3dde9;
      --text: #0f172a;
      --muted: #5b6b80;
      --accent: #0ea5e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(14, 165, 233, 0.12), transparent 28%),
        linear-gradient(180deg, #f8fbff, #f1f6fb 55%, #eef4f9);
    }

    .page {
      max-width: 1800px;
      margin: 0 auto;
      padding: 28px 20px 20px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
      padding: 18px 20px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    button {
      appearance: none;
      border: 1px solid rgba(14, 165, 233, 0.35);
      background: linear-gradient(180deg, #ffffff, #edf7ff);
      color: #0f172a;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button.ghost {
      border-color: rgba(148, 163, 184, 0.45);
      background: linear-gradient(180deg, #ffffff, #f3f6fa);
    }

    .grid-wrap {
      height: calc(100vh - 150px);
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./test-indexdb-glide.js"></script>
</body>
</html>
